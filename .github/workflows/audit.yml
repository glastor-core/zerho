name: Nemesis Universal Security, Hygiene & Compliance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Cada lunes a las 04:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write # Permite auto-commits de limpieza (Auto-Fix)
  pull-requests: write # Permite PR comments y 1-click review suggestions
  security-events: write # Permite carga de alertas SARIF a GitHub Security
  issues: write

jobs:
  security-audit:
    name: Security, Hygiene & Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Nemesis Security Audit
        uses: glastor-core/nemesis@v1.3.0
        with:
          auto-fix: true
          pr-suggestions: true
          diff-mode: ${{ github.event_name == 'pull_request' }}
          scan-secrets: true
          scan-sast: true
          scan-sca: true
          scan-hygiene: true
          scan-licenses: true
          generate-sbom: true
          max-file-size-mb: "10"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-sarif: "true"
